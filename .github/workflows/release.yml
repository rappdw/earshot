name: release

# Pushing a v* tag creates the GitHub release automatically with generated
# notes. There are no build artifacts: the repo itself is the plugin, and the
# CLI installs from a clone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: run the test suite
        run: |
          python3 -m unittest discover -s tests
          if [ "$RUNNER_OS" = "macOS" ]; then /bin/bash tests/test_bash.sh
          else bash tests/test_bash.sh; fi

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "earshot $GITHUB_REF_NAME" \
            --generate-notes
